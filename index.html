    <!-- For the richest previews later: a designed 1200×630 OG card (the professor photo is portrait, so it gets cropped in wide cards). -->
    <!-- NOTE: WhatsApp/Facebook cache previews per-URL. After deploy, re-scrape at developers.facebook.com/tools/debug or share with a ?v=2 cache-buster. -->

    <!-- apply the saved/system theme before paint to avoid a flash of the wrong mode -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme')
          var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
