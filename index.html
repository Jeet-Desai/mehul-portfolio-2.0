<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CommerceLab — by Dr. Mehulkumar Desai</title>
    <meta
      name="description"
      content="CommerceLab — a free learning hub for every commerce student. Calculators, practice quizzes, formula sheets and an AI doubt-tutor, built by Dr. Mehulkumar Desai, professor of 22 years."
    />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Open Graph — link previews on WhatsApp, Facebook, LinkedIn, Slack… -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CommerceLab" />
    <meta property="og:title" content="CommerceLab — by Dr. Mehulkumar Desai" />
    <meta
      property="og:description"
      content="Free tools for every Indian commerce student — step-by-step calculators, practice quizzes, formula sheets and an AI doubt-tutor. Built by a professor of 22 years."
    />
    <meta property="og:image" content="/images/DeanMEssage.jpeg" />
    <meta property="og:image:alt" content="Dr. Mehulkumar Desai" />
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CommerceLab — by Dr. Mehulkumar Desai" />
    <meta
      name="twitter:description"
      content="Free tools for every Indian commerce student — calculators, quizzes, formula sheets and an AI doubt-tutor."
    />
    <meta name="twitter:image" content="/images/DeanMEssage.jpeg" />
    <!-- Post-deploy: set og:url + an absolute og:image URL (and ideally a designed 1200×630 card) for the richest previews. -->

    <!-- apply the saved/system theme before paint to avoid a flash of the wrong mode -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme')
          var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
